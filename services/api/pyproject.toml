[project]
name = "vsa-api"
version = "0.1.0"
description = "Vertical AI Agent Platform API monolith."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sentry-sdk>=2.17",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "redis>=5.0",
    "python-ulid>=2.0",
    "jinja2>=3.1",
    "litellm>=1.50",
    "pyjwt[crypto]>=2.9",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsa_api"]
